<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>New Tab</title>
  <style>
    :root {
      --bg: #0b1220;
      --bg-elevated: rgba(15, 23, 42, 0.95);
      --panel-border: rgba(148, 163, 184, 0.2);
      --text: #e5eefb;
      --muted: #94a3b8;
      --link: #cbd5e1;
      --primary: #3b82f6;
      --primary-strong: #2563eb;
      --accent: #7dd3fc;
      --shadow: rgba(59, 130, 246, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    a {
      color: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 8%;
      background: var(--bg-elevated);
      border-bottom: 1px solid var(--panel-border);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
    }

    nav {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    nav a,
    nav .nav-disabled {
      color: var(--link);
      text-decoration: none;
      transition: color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      color: #fff;
    }

    .nav-button,
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.2rem;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--primary), var(--primary-strong));
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 10px 25px var(--shadow);
      border: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }

    .nav-button:hover,
    .nav-button:focus-visible,
    .button:hover,
    .button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.45);
    }

    .nav-disabled {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.2rem;
      border-radius: 999px;
      background: #334155;
      color: #cbd5e1;
      font-weight: 700;
      cursor: not-allowed;
      opacity: 0.7;
    }

    .hero {
      display: grid;
      place-items: center;
      min-height: 75vh;
      padding: 4rem 8%;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.25), transparent 35%),
        var(--bg);
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      margin: 0 auto 1rem;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #f8fafc;
    }

    .hero p {
      max-width: 620px;
      margin: 0 auto 2rem;
      font-size: 1.15rem;
      line-height: 1.7;
      color: var(--muted);
    }

    footer {
      padding: 1.5rem;
      text-align: center;
      color: var(--muted);
      border-top: 1px solid var(--panel-border);
      background: #0f172a;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 0.75rem;
        padding-top: 1.25rem;
        padding-bottom: 1.25rem;
      }

      nav {
        justify-content: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Tomato Games</div>
    <nav aria-label="Main navigation">
      <a href="games.html">Games</a>
      <span class="nav-disabled" aria-disabled="true">YouTube</span>
    </nav>
  </header>

  <main class="hero" id="about">
    <div class="hero-content">
      <h1>Welcome</h1>
      <p>Website is under development</p>
      <a class="button" href="games.html">Play</a>
    </div>
  </main>

  <footer id="contact">Developed by MustardTomatoKetchup.</footer>
</body>
</html>
