<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Google</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #e5eefb;
    }

    header {
      padding: 1rem 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      position: sticky;
      top: 0;
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: #7dd3fc;
    }

    nav a {
      margin-left: 1.5rem;
      color: #cbd5e1;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #ffffff;
    }

    .hero {
      min-height: 75vh;
      padding: 4rem 8%;
      display: grid;
      place-items: center;
      text-align: center;
      background:
        radial-gradient(circle at top, rgba(59, 130, 246, 0.25), transparent 35%),
        #0b1220;
    }

    .hero-content {
      max-width: 800px;
    }

    .hero h1 {
      margin: 0 auto 1rem;
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #f8fafc;
    }

    .hero p {
      margin: 0 auto 2rem;
      max-width: 620px;
      font-size: 1.15rem;
      line-height: 1.7;
      color: #94a3b8;
    }

    .button {
      display: inline-block;
      padding: 0.9rem 1.4rem;
      border-radius: 0.5rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 30px rgba(59, 130, 246, 0.45);
    }

    footer {
      padding: 1.5rem;
      text-align: center;
      color: #94a3b8;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      background: #0f172a;
    }

    @media (max-width: 600px) {
      header {
        flex-direction: column;
        gap: 0.75rem;
        padding-top: 1.25rem;
        padding-bottom: 1.25rem;
      }

      nav a {
        margin: 0 0.75rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Tomato Games</div>
    <nav>
      <a href="#about">Games</a>
      <a href="#contact">Other Stuff</a>
    </nav>
  </header>

  <main class="hero" id="about">
    <div class="hero-content">
      <h1>Welcome</h1></h1>
      <p>
        Website is under development
      </p>
      <a class="button" href="#contact">Play<a>
    </div>
  </main>

  <footer id="contact">We are not responsible if you get caught playing games.
    Use at your own risk.<footer>
</body>
</html>
