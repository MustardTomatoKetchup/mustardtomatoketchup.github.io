<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #1f2937;
      background: #f8fafc;
    }

    header {
      padding: 1rem 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: bold;
      color: #2563eb;
    }

    nav a {
      margin-left: 1.5rem;
      color: #475569;
      text-decoration: none;
    }

    .hero {
      min-height: 75vh;
      padding: 4rem 8%;
      display: grid;
      place-items: center;
      text-align: center;
    }

    .hero h1 {
      max-width: 700px;
      margin: 0 auto 1rem;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.1;
    }

    .hero p {
      max-width: 560px;
      margin: 0 auto 2rem;
      color: #64748b;
      font-size: 1.15rem;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      padding: 0.9rem 1.4rem;
      border-radius: 0.5rem;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    footer {
      padding: 1.5rem;
      text-align: center;
      color: #64748b;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">Brightside</div>
    <nav>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main class="hero" id="about">
    <div>
      <h1>A fresh start for your next big idea.</h1>
      <p>
        A simple, welcoming space to introduce your project, share what you do,
        and help visitors take the next step.
      </p>
      <a class="button" href="#contact">Get in touch</a>
    </div>
  </main>

  <footer id="contact">© 2026 Brightside. Made with care.</footer>
</body>
</html>
